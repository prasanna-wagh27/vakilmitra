name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vakilmitra
          POSTGRES_PASSWORD: vakilmitra
          POSTGRES_DB: vakilmitra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vakilmitra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vakilmitra:vakilmitra@localhost:5432/vakilmitra_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Postgres 16 client tools (backups dump and restore with the server's version)
        run: |
          mkdir -p "$RUNNER_TEMP/pg16"
          for t in pg_dump pg_restore; do
            printf '#!/bin/sh\nexec docker run --rm --network host -e PGPASSWORD -v /tmp:/tmp postgres:16 %s "$@"\n' "$t" > "$RUNNER_TEMP/pg16/$t"
            chmod +x "$RUNNER_TEMP/pg16/$t"
          done
          echo "PG_BIN_DIR=$RUNNER_TEMP/pg16" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pg16/pg_dump" --version
      - run: pnpm install --frozen-lockfile
      - name: License check (fails on banned licenses)
        run: pnpm check:licenses
      - name: Lint and format
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  # The server and web images build (not pushed): catches a broken Dockerfile before it reaches main.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: false
          cache-from: type=gha,scope=images
          cache-to: type=gha,scope=images,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          cache-from: type=gha,scope=images
