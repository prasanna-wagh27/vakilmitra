name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vakilmitra
          POSTGRES_PASSWORD: vakilmitra
          POSTGRES_DB: vakilmitra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vakilmitra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vakilmitra:vakilmitra@localhost:5432/vakilmitra_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: License check (fails on banned licenses)
        run: pnpm check:licenses
      - name: Lint and format
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
